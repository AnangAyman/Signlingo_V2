services:
  web:
    build: .
    ports:
      - "5001:5000"
    env_file:
      - .env
    extra_hosts:
      # Allows containers to reach services running on the host, such as an SSH tunnel.
      - "host.docker.internal:host-gateway"
    volumes:
      # This new line syncs all your project files
      - .:/app 
      # This line already persists your SQLite database
      - ./instance:/app/instance
