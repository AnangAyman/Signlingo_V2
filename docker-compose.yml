services:
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      # This line syncs all project files into the Django container during local development.
      - .:/app
      # This line persists the Django SQLite/state directory outside the container.
      - ./django_instance:/app/django_instance
    # The image CMD only runs gunicorn (Cloud Run-friendly). For local development we
    # still want migrations + seed data + static, so override the command here.
    command: >
      sh -c "python django_port/manage.py migrate &&
             python django_port/manage.py bootstrap_legacy_data &&
             python django_port/manage.py collectstatic --noinput &&
             gunicorn signlingo_django.wsgi:application --chdir django_port --bind 0.0.0.0:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
